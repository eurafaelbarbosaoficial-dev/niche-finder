<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Niche Finder — Validador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
.vl-app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 52px)}
.vl-lado{border-right:1px solid var(--ln);background:var(--p1);position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.pedir textarea{width:100%;min-height:64px;resize:vertical;background:var(--p2);border:1px solid var(--ln2);border-radius:6px;padding:8px;font-size:13.5px;color:var(--tx);outline:0}
.pedir textarea:focus{border-color:var(--am)} .pedir p{margin:0 0 9px;color:var(--mut);font-size:12.5px} .pedir .bt{margin-top:8px;width:100%;justify-content:center}
.it{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;padding:12px 18px;cursor:pointer}
.it:hover{background:var(--p2)} .it.on{background:var(--p2);box-shadow:inset 2px 0 0 var(--am)}
.it b{display:block;font-weight:600;font-size:13.5px;line-height:1.35} .it small{display:block;font:11px var(--mono);color:var(--dim);margin:3px 0 6px}
.mini{display:flex;gap:3px} .mini span{font:600 10px var(--mono);padding:1px 4px;border-radius:3px}
.k-oportunidade{background:var(--upbg);color:var(--up)} .k-oportunidade_fraca{background:var(--ambg);color:var(--am)}
.k-validado_concorrencia{background:rgba(122,162,247,.12);color:var(--az)} .k-validado_morno{background:var(--p3);color:var(--tx2)}
.k-feito_sem_sucesso{background:var(--dnbg);color:var(--dn)}
.vl-c{padding:24px 26px 70px;min-width:0}
.orig{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px;align-items:start}
.orig img{width:100%;border-radius:6px;border:1px solid var(--ln);display:block}
.orig h1{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.2}
.ometa{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 12px;font:12.5px var(--mono);color:var(--tx2)} .ometa b{color:var(--tx)}
.molde{font:13px var(--mono);border:1px solid var(--amln);background:var(--ambg);color:var(--am2);padding:7px 10px;border-radius:6px;display:inline-block}
.nota{margin-top:10px;font-size:12.5px;color:var(--mut);max-width:640px}
.sec{margin:30px 0 10px;display:flex;align-items:baseline;gap:10px} .sec h2{margin:0;font-size:16px;font-weight:600} .sec span{color:var(--mut);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tiles.d{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.tl{border:1px solid var(--ln);background:var(--p2);border-radius:8px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl:hover{border-color:var(--ln2)} .tl.on{border-color:var(--am);box-shadow:0 0 0 1px var(--am) inset}
.tl .lg{font:600 18px var(--mono)} .tl .nm{font-size:12px;color:var(--mut)} .tl .vd{font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:4px;align-self:flex-start}
.tl .nn{font:12px var(--mono);color:var(--tx2)}
.det{margin-top:12px;border:1px solid var(--ln);border-radius:8px;background:var(--p1)}
.det-h{padding:14px 16px;border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.det-h h3{margin:0;font-size:16px} .det-h p{margin:4px 0 0;color:var(--tx2);font-size:13.5px;max-width:760px}
.bq{padding:14px 16px;border-bottom:1px solid var(--ln)} .bq:last-child{border-bottom:0}
.bq-t{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bq-t .tp{font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--ln2);color:var(--tx2)}
.bq-t code{font:13px var(--mono);color:var(--am2)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border:1px solid var(--ln);border-radius:6px;margin-bottom:10px}
.nums div{padding:8px 10px;border-right:1px solid var(--ln)} .nums div:last-child{border-right:0}
.nums small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)} .nums b{font:600 15px var(--mono)}
.tb.v td.t a:hover{text-decoration:underline} .tb.v tr{cursor:default} .tb.v{min-width:640px}
.fm{font:600 11px var(--mono)} .fm.s{color:var(--up)} .fm.n{color:var(--dim)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--mut)} .leg span{display:flex;gap:6px;align-items:center}
.leg i{font-style:normal;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:860px){.vl-app{grid-template-columns:1fr}.vl-lado{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ln)}
  .vl-c{padding:18px 16px 50px}.orig{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a class="marca" href="index.html"><span class="sq">NF</span><span>Niche Finder</span></a>
  <nav class="abas"><a href="index.html">Canais</a><a class="on" href="validador.html">Validador</a></nav>
  <div class="hd-dir"><span class="vivo"><span>Validador de dobras</span></span></div>
</div></header>

<div class="vl-app">
  <aside class="vl-lado">
    <div class="bloco pedir">
      <div class="rot">Pedir uma validação</div>
      <p>Cole o título que estourou, copie o pedido e mande para o Claude (Claude Code, pasta Niche Finder). Leva ~15 min.</p>
      <textarea id="tit" placeholder="Ex.: Every Money Laundering Technique Explained"></textarea>
      <button class="bt pri" id="cop">Copiar pedido</button>
    </div>
    <div class="bloco" style="padding-bottom:6px"><div class="rot">Validações feitas <span class="dica" id="nval"></span></div></div>
    <div id="lista"></div>
  </aside>
  <main class="vl-c" id="det">
    <div class="vazio">Carregando…</div>
  </main>
</div>

<script>
(function(){
var LAB={oportunidade:"Oportunidade",oportunidade_fraca:"Vazio, procura fraca",validado_concorrencia:"Validado · subnichar",validado_morno:"Validado morno",feito_sem_sucesso:"Feito sem sucesso"};
var CUR={oportunidade:"OP",oportunidade_fraca:"VZ",validado_concorrencia:"VD",validado_morno:"VM",feito_sem_sucesso:"FS"};
var NOME={pt:"Português",es:"Espanhol",en:"Inglês",de:"Alemão",fr:"Francês"};
var idx=[],dado=null,sel=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function f(n){if(n==null)return"—";if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,"").replace(".",",")+" mi";if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,"").replace(".",",")+" mil";return String(n);}
function vd(v,t){return"<span class='vd k-"+v+"'>"+esc(t||LAB[v]||v)+"</span>";}
function dur(s){return s?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):"?";}
var t0=new URLSearchParams(location.search).get("t");if(t0)$("tit").value=t0;
$("cop").onclick=function(){var t=$("tit").value.trim(),b=this;
  var txt='Valide no Validador de dobras o título: "'+(t||"<cole aqui>")+'". Pesquise em PT, ES, EN, DE e FR e sugira dobras.';
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){b.textContent="Copiado ✓";setTimeout(function(){b.textContent="Copiar pedido";},1800);},function(){prompt("Copie o pedido:",txt);});};

function lista(){var s=location.hash.slice(1);$("nval").textContent=idx.length;
  $("lista").innerHTML=idx.map(function(x){var r=x.resumo||{};return"<button class='it"+(x.slug===s?" on":"")+"' data-s='"+esc(x.slug)+"'><b>"+esc(x.titulo||x.slug)+"</b><small>"+esc(x.data)+"</small><span class='mini'>"+
    Object.keys(r).map(function(k){return"<span class='k-"+r[k]+"' title='"+NOME[k]+": "+(LAB[r[k]]||"")+"'>"+k.toUpperCase()+"</span>";}).join("")+"</span></button>";}).join("")||"<div class='bloco mut'>Nenhuma validação ainda.</div>";
  [].forEach.call($("lista").querySelectorAll(".it"),function(b){b.onclick=function(){location.hash=b.dataset.s;};});}

function bloco(g){
  var h="<div class='det-h'><div style='flex:1;min-width:240px'><h3>"+esc(g.titulo)+"</h3><p>"+esc(g.explica)+"</p>"+(g.nota?"<p class='mut'>Por que testar: "+esc(g.nota)+"</p>":"")+"</div>"+vd(g.veredito)+"</div>";
  return h+(g.buscas||[]).map(function(b){var tema=b.tipo==="tema";
    var it=(b.itens||[]).filter(function(i){return i.conferido;});
    return"<div class='bq'><div class='bq-t'><span class='tp'>"+(tema?"Tema · procura":"Molde · concorrência")+"</span><code>"+esc(b.busca)+"</code></div>"+
    "<div class='nums'>"+(tema?"":"<div><small>Concorrentes</small><b>"+b.concorrentes+"</b></div><div><small>Melhor concorrente</small><b>"+f(b.melhor_concorrente)+"</b></div>"+(b.copias_fracas?"<div><small>Cópias &lt;1 mil</small><b style='color:var(--dn)'>"+b.copias_fracas+"</b></div>":""))+
      "<div><small>Maior de outro formato</small><b>"+f(b.adjacentes_max)+"</b></div><div><small>Procura (0–10)</small><b>"+b.procura+"</b></div></div>"+
    "<div class='tw'><table class='tb v'><thead><tr><th>Formato</th><th>Idioma</th><th>Vídeo</th><th style='text-align:right'>Views</th><th style='text-align:right'>Dur.</th></tr></thead><tbody>"+
    it.map(function(i){return"<tr><td><span class='fm "+(i.mesmo_formato?"s'>● mesmo":"n'>○ outro")+"</span></td><td><span class='tag'>"+esc((i.idioma_real||"?").toUpperCase())+"</span></td>"+
      "<td class='t' style='white-space:normal'><a href='https://youtu.be/"+esc(i.id)+"' target='_blank' rel='noopener'>"+esc(i.titulo)+"</a><div class='mut' style='font-size:12px'>"+esc(i.canal||"?")+"</div></td>"+
      "<td class='n'>"+f(i.views)+"</td><td class='n'>"+dur(i.dur)+"</td></tr>";}).join("")+"</tbody></table></div></div>";}).join("");
}
function render(){
  var d=dado,o=d.origem||{},grupos=[];
  (d.idiomas||[]).forEach(function(l){grupos.push({k:"i-"+l.idioma,tipo:"i",cod:l.idioma,titulo:(NOME[l.idioma]||l.nome),veredito:l.veredito,explica:l.explica,buscas:l.buscas});});
  (d.dobras||[]).forEach(function(x,i){grupos.push({k:"d-"+i,tipo:"d",cod:(x.idioma||"").toUpperCase(),titulo:x.nome,nota:x.nota,veredito:x.veredito,explica:x.explica,buscas:x.buscas});});
  if(!sel||!grupos.some(function(g){return g.k===sel;})){var op=grupos.filter(function(g){return g.veredito==="oportunidade";})[0];sel=(op||grupos[0]||{}).k;}
  function melhor(g){var m=(g.buscas||[]).filter(function(b){return b.tipo!=="tema";}).map(function(b){return b.melhor_concorrente||0;});return Math.max.apply(0,m.concat([0]));}
  function tile(g){return"<button class='tl"+(g.k===sel?" on":"")+"' data-k='"+g.k+"'>"+(g.tipo==="i"?"<span class='lg'>"+g.cod.toUpperCase()+"</span><span class='nm'>"+esc(g.titulo)+"</span>":"<span class='nm'>"+esc(g.cod)+"</span><b style='font-size:14px'>"+esc(g.titulo)+"</b>")+
    vd(g.veredito)+"<span class='nn'>"+(melhor(g)?"melhor: "+f(melhor(g)):"ninguém no formato")+"</span></button>";}
  var g=grupos.filter(function(x){return x.k===sel;})[0];
  $("det").innerHTML="<div class='orig'>"+(o.id?"<a href='https://youtu.be/"+esc(o.id)+"' target='_blank' rel='noopener'><img src='https://i.ytimg.com/vi/"+esc(o.id)+"/hqdefault.jpg' alt=''></a>":"<div></div>")+
    "<div><div class='rot'>Título de origem</div><h1>"+esc(o.titulo||d.slug)+"</h1><div class='ometa'><span>"+esc(o.canal||"")+"</span>"+(o.views?"<span><b>"+f(o.views)+"</b> views</span>":"")+(o.inscritos?"<span><b>"+f(o.inscritos)+"</b> inscritos</span>":"")+(o.idioma?"<span>idioma <b>"+esc(o.idioma.toUpperCase())+"</b></span>":"")+"</div>"+
    (d.molde?"<span class='molde'>molde → "+esc(d.molde)+"</span>":"")+
    "<div class='nota'>Pesquisado em "+esc(d.data)+". Concorrente = vídeo de 4 min+ no idioma real, com as palavras do molde no título (o vídeo e o canal de origem não contam). Validado = algum com "+f(d.criterios.bom)+"+ views; sem sucesso = o melhor abaixo de "+f(d.criterios.fraco)+".</div>"+
    "<div class='leg'>"+Object.keys(LAB).map(function(k){return"<span><i class='k-"+k+"'>"+LAB[k]+"</i></span>";}).join("")+"</div></div></div>"+
    "<div class='sec'><h2>O mesmo molde em 5 idiomas</h2><span>clique num idioma para ver os vídeos</span></div><div class='tiles'>"+grupos.filter(function(x){return x.tipo==="i";}).map(tile).join("")+"</div>"+
    (grupos.some(function(x){return x.tipo==="d";})?"<div class='sec'><h2>Dobras para outros nichos</h2><span>mesmo molde, outro assunto ou público</span></div><div class='tiles d'>"+grupos.filter(function(x){return x.tipo==="d";}).map(tile).join("")+"</div>":"")+
    (g?"<div class='det' id='bloco'>"+bloco(g)+"</div>":"");
  [].forEach.call($("det").querySelectorAll(".tl"),function(b){b.onclick=function(){sel=b.dataset.k;render();$("bloco").scrollIntoView({behavior:"smooth",block:"start"});};});
}
function abrir(){var s=location.hash.slice(1)||(idx[0]||{}).slug;lista();
  if(!s){$("det").innerHTML="<div class='vazio'>Nenhuma validação ainda. Cole um título ao lado e peça ao Claude.</div>";return;}
  [].forEach.call($("lista").querySelectorAll(".it"),function(b){b.classList.toggle("on",b.dataset.s===s);});
  fetch("validacoes/"+encodeURIComponent(s)+".json?t="+Date.now()).then(function(r){return r.json();}).then(function(d){dado=d;sel=null;render();})
  .catch(function(){$("det").innerHTML="<div class='vazio'>Não achei essa validação.</div>";});}
fetch("validacoes/index.json?t="+Date.now()).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];}).then(function(d){idx=d||[];abrir();});
window.addEventListener("hashchange",abrir);
})();
</script>
</body>
</html>
