<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #efe6d2; }
    #ko-cv { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #ko-aber { position: absolute; left: 130px; top: 96px; color: #b8503a; font: 700 italic 120px/1 "Playfair Display", serif; }
    #ko-titel { position: absolute; left: 130px; top: 96px; color: #2b2420; font: 700 112px/1.02 "Playfair Display", serif; letter-spacing: -.01em; transform-origin: 0% 50%; }
    #ko-titel em { color: #b8503a; font-style: italic; }
  </style>
  <div id="root" data-composition-id="konto" data-width="1920" data-height="1080">
    <canvas id="ko-cv" width="1920" height="1080"></canvas>
    <div id="ko-aber" class="clip" data-start="0.00" data-duration="1.66">Aber…</div>
    <div id="ko-titel" class="clip" data-start="4.06" data-duration="1.63">Auf einem <em>Bankkonto.</em></div>
  </div>
  <script>
    (function () {
      const P = window.Pincel, C = P.COR;
      const cv = document.querySelector("#ko-cv"); let ctx = cv.getContext("2d");
      const papel = P.papel(1920, 1080);
      const camada = document.createElement("canvas"); camada.width = 1920; camada.height = 1080; const cx2 = camada.getContext("2d");
      const B = [
        { x: 1150, y: 420, rx: 165, ry: 128, t: 0.3, s: 11 },
        { x: 1580, y: 282, rx: 160, ry: 124, t: 0.42, s: 23 },
        { x: 1470, y: 742, rx: 170, ry: 128, t: 0.54, s: 37 },
      ];
      const CARTAO = { x: 1440, y: 600, w: 560, h: 340 };
      const MOEDAS = Array.from({ length: 9 }, (_, k) => ({ de: B[k % 3], t0: 1.05 + k * 0.2, dx: (k % 3 - 1) * 40 }));
      const VOO = 0.65;

      function doner(x, y, sd) {
        P.forma(ctx, [[x - 80, y + 30], [x - 70, y - 20], [x - 30, y - 52], [x + 30, y - 52], [x + 70, y - 20], [x + 80, y + 30]], { fill: "#e2b06a", sombra: "#c48f4c", brilho: "rgba(255,240,200,.35)", seed: sd });
        P.forma(ctx, [[x - 66, y - 18], [x - 40, y - 46], [x - 10, y - 40], [x + 20, y - 50], [x + 52, y - 38], [x + 68, y - 16], [x + 30, y - 26], [x - 20, y - 22]], { fill: C.salvia, sombra: "#6e8a52", seed: sd + 1, w: 4.5 });
        [[-34, -30], [6, -36], [40, -26]].forEach(([dx, dy], i) => P.forma(ctx, P.elipse(x + dx, y + dy, 14, 11, 9), { fill: "#c9553e", sombra: "#a23f2c", seed: sd + 2 + i, w: 4 }));
        P.traco(ctx, [[x - 56, y - 6], [x, y - 14], [x + 56, y - 6]], { w: 7, cor: "#7a4a2a", seed: sd + 6 });
      }
      function shisha(x, y, sd) {
        P.membro(ctx, [[x + 14, y - 14], [x + 70, y + 8], [x + 74, y + 56], [x + 50, y + 76]], 7, "#5d4a3a", sd + 9);
        P.forma(ctx, [[x - 9, y - 70], [x + 9, y - 70], [x + 11, y + 4], [x - 11, y + 4]], { fill: "#c9a05c", sombra: "#a07a3c", seed: sd, w: 4 });
        P.forma(ctx, [[x - 28, y - 86], [x + 28, y - 86], [x + 16, y - 66], [x - 16, y - 66]], { fill: C.terracota, sombra: "#963d2b", seed: sd + 1, w: 4.5 });
        P.forma(ctx, P.elipse(x, y + 42, 50, 46, 16), { fill: C.ardosia, sombra: C.ardosiaS, brilho: "rgba(255,255,255,.28)", seed: sd + 2 });
      }
      function koffer(x, y, sd) {
        [[-56, -6], [-20, -14], [16, -8], [46, -16]].forEach(([dx, r], i) => P.forma(ctx, [[x + dx - 22, y - 84 - r], [x + dx + 22, y - 88 - r * 0.6], [x + dx + 24, y - 30], [x + dx - 20, y - 30]], { fill: "#9cbf86", sombra: "#7a9c66", seed: sd + i, w: 4 }));
        P.forma(ctx, [[x - 92, y - 42], [x + 92, y - 42], [x + 96, y + 52], [x - 96, y + 52]], { fill: "#6a5240", sombra: "#4f3c2e", brilho: "rgba(255,230,200,.18)", seed: sd + 5 });
        P.traco(ctx, [[x - 94, y - 16], [x + 94, y - 16]], { w: 4.5, seed: sd + 6 });
      }
      function bezier(a, c, b, u) { const v = 1 - u; return [v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]; }

      function desenhar(t) {
        const f = P.quadro(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(papel, 0, 0);
        const [sx, sy] = P.tremor(t, 4.18, 0.5, 20, 5);
        const z = 1.035 + 0.03 * P.ease.inOut(P.seg(t, 0, 6.65));
        ctx.translate(800 + sx, 600 + sy); ctx.scale(z, z); ctx.translate(-800, -600);
        P.brilhoSuave(ctx, 470, 760, 520, "rgba(232,180,80,0.30)");

        const somem = 1 - P.seg(t, 0.25, 0.4);
        if (somem > 0) [[650, 560, 11], [712, 500, 17], [790, 452, 23]].forEach(([x, y, r], i) => {
          ctx.save(); ctx.globalAlpha = somem; P.forma(ctx, P.elipse(x, y, r, r, 10), { fill: C.nuvem, seed: f * 13 + i, w: 5 }); ctx.restore();
        });
        B.forEach((b, i) => {
          const u = P.seg(t, b.t, b.t + 0.2);
          if (u < 1) {
            // desenha o balão numa camada à parte e aplica a transparência no conjunto
            const real = ctx; cx2.setTransform(1, 0, 0, 1, 0, 0); cx2.clearRect(0, 0, 1920, 1080);
            ctx = cx2;
            P.nuvem(ctx, b.x, b.y, b.rx, b.ry, f * 7 + b.s);
            if (i === 0) doner(b.x, b.y + 10, f * 31 + 100);
            if (i === 1) shisha(b.x - 16, b.y + 14, f * 31 + 200);
            if (i === 2) koffer(b.x, b.y + 4, f * 31 + 300);
            ctx = real;
            ctx.save(); ctx.globalAlpha = 1 - u; ctx.translate(b.x, b.y); ctx.scale(1 + u * 0.25, 1 + u * 0.25); ctx.translate(-b.x, -b.y);
            ctx.drawImage(camada, 0, 0);
            ctx.restore();
          }
          const e = P.seg(t, b.t + 0.02, b.t + 0.32);
          if (e > 0 && e < 1) for (let k = 0; k < 9; k++) {
            const a = (k / 9) * Math.PI * 2 + i, r0 = b.rx * (0.9 + e * 0.5), r1 = r0 + 40 * (1 - e);
            P.traco(ctx, [[b.x + Math.cos(a) * r0, b.y + Math.sin(a) * r0 * 0.8], [b.x + Math.cos(a) * r1, b.y + Math.sin(a) * r1 * 0.8]], { w: 7, alpha: 1 - e, seed: f + k });
          }
        });

        const ce = P.ease.out(P.seg(t, 0.7, 1.25));
        let chegaram = 0, bump = 0;
        MOEDAS.forEach((m) => { const fim = m.t0 + VOO; if (t >= fim) { chegaram++; bump = Math.max(bump, 1 - P.seg(t, fim, fim + 0.18)); } });
        if (ce > 0) {
          const { x, y, w, h } = CARTAO, s = 1 + bump * 0.04;
          ctx.save(); ctx.translate(x + (1 - ce) * 760, y); ctx.rotate(-0.05 + (1 - ce) * 0.2); ctx.scale(s, s);
          ctx.fillStyle = "rgba(70,45,20,0.16)"; ctx.beginPath(); P.caminho(ctx, P.ret(-w / 2 + 14, -h / 2 + 18, w, h), true); ctx.fill();
          P.forma(ctx, P.ret(-w / 2, -h / 2, w, h), { fill: "#2e3348", sombra: "#232738", brilho: "rgba(255,255,255,.08)", seed: f * 41 + 1, w: 6, sdx: -40, sdy: -24 });
          P.forma(ctx, P.ret(-w / 2 + 50, -h / 2 + 56, 84, 62), { fill: "#e3b44c", sombra: "#b98a2f", seed: f * 41 + 2, w: 4 });
          P.traco(ctx, [[-w / 2 + 70, -h / 2 + 87], [-w / 2 + 114, -h / 2 + 87]], { w: 3, cor: "#8a6a1e", seed: f + 3 });
          for (let g = 0; g < 4; g++) for (let d = 0; d < 4; d++) { ctx.fillStyle = "#a9b8d6"; ctx.beginPath(); ctx.arc(-w / 2 + 56 + g * 116 + d * 22, 18, 6, 0, 7); ctx.fill(); }
          P.forma(ctx, P.ret(-w / 2 + 50, h / 2 - 82, w - 100, 32), { fill: "#1d2030", seed: f * 41 + 5, w: 4 });
          const enche = P.ease.out(P.clamp(chegaram / 9, 0, 1));
          if (enche > 0) { ctx.fillStyle = "#e3b44c"; ctx.fillRect(-w / 2 + 56, h / 2 - 76, (w - 112) * enche, 20); }
          ctx.restore();
        }
        MOEDAS.forEach((m, k) => {
          const u = P.seg(t, m.t0, m.t0 + VOO);
          if (u <= 0 || u >= 1) return;
          const a = [m.de.x + m.dx, m.de.y], b = [CARTAO.x, CARTAO.y + 10], c = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 260];
          const [x, y] = bezier(a, c, b, P.ease.inOut(u));
          const s = 0.6 + 0.4 * Math.sin(Math.PI * u) + 0.3 * (1 - u);
          ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
          P.moeda(ctx, 0, 0, 38, (t - m.t0) * 12, f * 19 + k * 3);
          ctx.restore();
        });

        const nao = Math.sin(t * Math.PI * 2 * 3.2) * 0.11 * (1 - P.seg(t, 0.05, 0.9));
        const st = {
          respira: Math.sin((t + 5.6) * Math.PI * 2 / 2.6),
          incl: nao + P.keyed(t, [[0, -0.02], [1.1, 0.06], [3.9, 0]], 0.4),
          inclCorpo: nao * 0.15,
          olhar: P.keyed(t, [[0, [0.1, 0]], [0.28, [0.9, -0.4]], [1.1, [1, 0.1]], [3.9, [0, 0]]], 0.25),
          pisca: P.piscar(t, [2.3, 4.7]),
          sobrancelha: P.keyed(t, [[0, 0.1], [3.9, 0.55]], 0.3),
          zangado: P.keyed(t, [[0, 0], [0.04, 1], [1.2, 0.6], [3.9, 0.35]], 0.12),
          boca: P.keyed(t, [[0, -0.3], [0.04, -0.6], [3.9, 0.25]], 0.25),
          mao: P.keyed(t, [[0, 0.15], [0.3, 0]], 0.3),
        };
        ctx.save(); ctx.translate(470, 1150); ctx.scale(0.98, 0.98);
        P.detetive(ctx, st, t + 5.6);
        ctx.restore();

        const sub = P.ease.inOut(P.seg(t, 4.45, 4.85));
        if (sub > 0) {
          ctx.setTransform(1, 0, 0, 1, sx, sy);
          P.traco(ctx, P.parcial(P.linha([[132, 238], [700, 232], [1250, 240]], 20), sub), { w: 14, cor: "#d9a441", seed: f * 7 + 99, alpha: 0.9 });
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        P.vinheta(ctx, 1920, 1080, 0.24);
      }

      const tl = gsap.timeline({ paused: true });
      const relogio = { t: 0 };
      tl.fromTo(relogio, { t: 0 }, { t: 6.65, duration: 6.65, ease: "none", onUpdate: () => desenhar(relogio.t) }, 0);
      tl.fromTo("#ko-aber", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.out", transformOrigin: "0% 50%" }, 0.02);
      tl.to("#ko-aber", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 1.35);
      tl.fromTo("#ko-titel", { opacity: 0, scale: 1.45 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.in" }, 4.18);
      desenhar(0);
      (function () {
        const W = [[0.0, 0.0], [0.24, 0.33], [0.48, 0.55], [0.7, 0.73], [1.04, 1.07], [1.5, 1.55], [1.8, 1.83], [2.42, 2.45], [2.78, 2.81], [3.06, 3.09], [3.62, 3.67], [4.32, 4.35], [4.52, 4.55], [4.78, 4.81], [5.69, 6.65]], inner = tl, D = 5.690;
        const wl = (x) => { for (let k = 0; k < W.length - 1; k++) { const [n0, o0] = W[k], [n1, o1] = W[k + 1]; if (x >= n0 && x <= n1) return o0 + (x - n0) * (o1 - o0) / Math.max(1e-6, n1 - n0); } return W[W.length - 1][1]; };
        const outer = gsap.timeline({ paused: true }); const rr = { t: 0 };
        outer.fromTo(rr, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => inner.seek(wl(rr.t), false) }, 0);
        inner.seek(0, false);
        window.__timelines["konto"] = outer;
      })();
    })();
  </script>
</template>
