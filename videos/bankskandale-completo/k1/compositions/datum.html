<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #1d2740; }
    #dt-cv { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    #dt-text { position: absolute; left: 130px; top: 150px; color: #f4ecdc; text-shadow: 0 4px 30px rgba(10,14,30,.6); }
    #dt-dia { font: 700 34px/1 Inter, sans-serif; letter-spacing: .34em; text-transform: uppercase; color: #a9b8d6; }
    #dt-data { margin-top: 22px; font: 700 124px/1 "Playfair Display", serif; letter-spacing: -.01em; }
    #dt-data span { display: inline-block; }
    #dt-d3 { color: #e3b44c; font-style: italic; }
    #dt-local { margin-top: 38px; display: flex; align-items: center; gap: 18px; font: 600 46px/1 Inter, sans-serif; color: #e3b44c; }
    #dt-local svg { width: 40px; height: 52px; }
  </style>
  <div id="root" data-composition-id="datum" data-width="1920" data-height="1080">
    <canvas id="dt-cv" width="1920" height="1080"></canvas>
    <div id="dt-text">
      <div id="dt-dia" class="clip" data-start="0.00" data-duration="5.17">Donnerstag</div>
      <div id="dt-data" class="clip" data-start="0.00" data-duration="5.17"><span id="dt-d1">29.</span> <span id="dt-d2">November</span> <span id="dt-d3">2018</span></div>
      <div id="dt-local" class="clip" data-start="3.12" data-duration="2.05">
        <svg viewBox="0 0 40 52"><path d="M20 2C10 2 2 10 2 20c0 14 18 30 18 30s18-16 18-30C38 10 30 2 20 2z" fill="#e3b44c" stroke="#2b2420" stroke-width="3" /><circle cx="20" cy="19" r="7" fill="#1d2740" /></svg>
        <span>Frankfurt am Main</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const P = window.Pincel;
      const cv = document.querySelector("#dt-cv"), ctx = cv.getContext("2d");
      const papel = P.papel(1920, 1080, "#8a8577");
      const R = P.rng(5);
      const estrelas = Array.from({ length: 46 }, () => [R() * 1920, R() * 520, 1 + R() * 2.4, R() * 6.28]);
      const fundo = [], frente = [];
      for (let x = -40; x < 1960;) { const w = 90 + R() * 130; fundo.push([x, w, 260 + R() * 260]); x += w - 10; }
      for (let x = -60; x < 1980;) { const w = 120 + R() * 150; if (x > 1260 && x < 1690) { x = 1690; continue; } frente.push([x, w, 140 + R() * 210, R()]); x += w + 6; }

      function torre(x, base, w, h, cor, sombra, sd, t) {
        const f = P.quadro(t);
        const pts = P.poli([[x, base], [x, base - h + 40], [x + w, base - h], [x + w, base]], 30);
        P.forma(ctx, pts, { fill: cor, sombra, brilho: "rgba(180,210,255,.18)", seed: f * 17 + sd, sdx: -w * 0.3, sdy: 0, w: 5 });
        ctx.save(); ctx.beginPath(); P.caminho(ctx, pts, true); ctx.clip();
        for (let i = 0; i < 18; i++) P.traco(ctx, [[x, base - 60 - i * 40], [x + w, base - 90 - i * 40]], { w: 2.2, cor: "rgba(160,195,255,.35)", seed: f * 3 + sd + i });
        const rr = P.rng(sd);
        for (let i = 0; i < 40; i++) { const wx = x + 10 + rr() * (w - 26), wy = base - 40 - rr() * (h - 90); ctx.fillStyle = rr() > 0.5 ? "rgba(246,220,154,.85)" : "rgba(160,195,255,.5)"; ctx.fillRect(wx, wy, 12, 8); }
        ctx.restore();
      }

      function desenhar(t) {
        const f = P.quadro(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#1a2238"; ctx.fillRect(0, 0, 1920, 1080);
        P.brilhoSuave(ctx, 1100, 100, 1100, "rgba(64,86,135,0.75)");
        // câmera: desce devagar
        const z = 1.07 - 0.07 * P.ease.out(P.seg(t, 0, 5.35));
        ctx.translate(960, 1080); ctx.scale(z, z); ctx.translate(-960, -1080 + 30 * (1 - P.seg(t, 0, 5.35)));
        estrelas.forEach(([x, y, r, ph]) => { ctx.globalAlpha = 0.45 + 0.4 * Math.sin(t * 2.2 + ph); ctx.fillStyle = "#f4ecdc"; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
        ctx.globalAlpha = 1;
        P.brilhoSuave(ctx, 1790, 170, 200, "rgba(244,236,220,0.18)");
        P.forma(ctx, P.elipse(1790, 170, 64, 64, 16), { fill: "#f1e6cc", sombra: "#c9bc9c", seed: f * 3 + 1, sdx: 22, sdy: -10, w: 4, inkCor: "#141a2c" });
        // camada de trás
        fundo.forEach(([x, w, h], i) => P.forma(ctx, P.ret(x, 1080 - h - 120, w, h + 200, 3), { fill: "#26314d", seed: f * 5 + i, w: 3, inkCor: "#141a2c" }));
        // torres (centro-direita)
        torre(1330, 1090, 150, 790, "#2f4a78", "#22385e", 300, t);
        torre(1500, 1090, 165, 750, "#36558a", "#27416b", 400, t);
        // camada da frente com janelas
        frente.forEach(([x, w, h, k], i) => {
          P.forma(ctx, P.ret(x, 1080 - h, w, h + 40, 3), { fill: "#18203a", sombra: "#121830", seed: f * 7 + i, w: 4, inkCor: "#0c1020" });
          const rr = P.rng(i * 31 + 7);
          for (let j = 0; j < 7; j++) { const wx = x + 14 + rr() * (w - 34), wy = 1080 - h + 20 + rr() * (h - 50); if (rr() > 0.45) { ctx.fillStyle = "rgba(246,220,154,.8)"; ctx.fillRect(wx, wy, 14, 10); } }
        });
        // névoa e luzes de polícia na rua
        P.brilhoSuave(ctx, 960, 1180, 900, "rgba(120,140,190,0.25)");
        const azul = Math.max(0, Math.sin(t * Math.PI * 2 * 1.6)), verm = Math.max(0, Math.sin(t * Math.PI * 2 * 1.6 + Math.PI));
        const entra = P.seg(t, 0.1, 0.6);
        ctx.globalCompositeOperation = "lighter";
        P.brilhoSuave(ctx, 420, 1100, 650, `rgba(61,123,255,${0.45 * azul * entra})`);
        P.brilhoSuave(ctx, 1500, 1100, 650, `rgba(229,72,77,${0.38 * verm * entra})`);
        ctx.globalCompositeOperation = "source-over";
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        // textura de papel por cima (dá cara de pintura)
        ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.5; ctx.drawImage(papel, 0, 0);
        ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
        P.vinheta(ctx, 1920, 1080, 0.45);
      }

      const tl = gsap.timeline({ paused: true });
      const relogio = { t: 0 };
      tl.fromTo(relogio, { t: 0 }, { t: 5.35, duration: 5.35, ease: "none", onUpdate: () => desenhar(relogio.t) }, 0);
      tl.fromTo("#dt-dia", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05);
      tl.fromTo("#dt-d1", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.9);
      tl.fromTo("#dt-d2", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.85);
      tl.fromTo("#dt-d3", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.6);
      tl.fromTo("#dt-local", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 3.27);
      tl.to("#dt-text", { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.1);
      desenhar(0);
      (function () {
        const W = [[0.0, 0.0], [0.88, 0.94], [1.76, 1.82], [2.2, 2.28], [3.98, 4.06], [4.22, 4.32], [4.5, 4.58], [5.17, 5.35]], inner = tl, D = 5.170;
        const wl = (x) => { for (let k = 0; k < W.length - 1; k++) { const [n0, o0] = W[k], [n1, o1] = W[k + 1]; if (x >= n0 && x <= n1) return o0 + (x - n0) * (o1 - o0) / Math.max(1e-6, n1 - n0); } return W[W.length - 1][1]; };
        const outer = gsap.timeline({ paused: true }); const rr = { t: 0 };
        outer.fromTo(rr, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => inner.seek(wl(rr.t), false) }, 0);
        inner.seek(0, false);
        window.__timelines["datum"] = outer;
      })();
    })();
  </script>
</template>
